<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      <![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Figtree:wght@300;400;600&display=swap');
      .title { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; }
      .body { font-family: 'Figtree', sans-serif; font-weight: 300; }
      ]]>
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="1080" height="1080" fill="#f4ecd3"/>
  
  <!-- Decorative spirals - soft blue (organic placement) -->
  <g opacity="0.25" stroke="#9ab4c1" fill="none" stroke-width="2.5" stroke-linecap="round">
    <!-- Top left spiral -->
    <g transform="translate(120, 150)">
      <path d="M 50 50 m 0 -35 a 35 35 0 0 1 0 70 a 28 28 0 0 1 0 -56 a 21 21 0 0 1 0 42 a 14 14 0 0 1 0 -28 a 7 7 0 0 1 0 14" />
    </g>
    
    <!-- Top right spiral -->
    <g transform="translate(900, 120)">
      <path d="M 50 50 m 0 -35 a 35 35 0 0 1 0 70 a 28 28 0 0 1 0 -56 a 21 21 0 0 1 0 42 a 14 14 0 0 1 0 -28" />
    </g>
    
    <!-- Bottom left spiral -->
    <g transform="translate(100, 900)">
      <path d="M 50 50 m 0 -35 a 35 35 0 0 1 0 70 a 28 28 0 0 1 0 -56 a 21 21 0 0 1 0 42" />
    </g>
    
    <!-- Middle right accent -->
    <g transform="translate(850, 500) scale(0.6)">
      <path d="M 50 50 m 0 -35 a 35 35 0 0 1 0 70 a 28 28 0 0 1 0 -56 a 21 21 0 0 1 0 42" />
    </g>
  </g>
  
  <!-- Main Content -->
  <g transform="translate(540, 360)">
    <!-- Title -->
    <text x="0" y="100" text-anchor="middle" class="title" font-size="120" fill="#9ab4c1" font-weight="800" letter-spacing="-2">
      The Essentials
    </text>
    
    <!-- Duration -->
    <text x="0" y="180" text-anchor="middle" class="body" font-size="28" fill="#440a09" font-weight="300" letter-spacing="0.5">
      (45 minutes)
    </text>
    
    <!-- Description -->
    <text x="0" y="240" text-anchor="middle" class="body" font-size="26" fill="#440a09" font-weight="300" letter-spacing="0.2">
      <tspan x="0" dy="0">An express treatment that delivers a thoughtful</tspan>
      <tspan x="0" dy="36">edit of the fundamentals - from a deep cleanse</tspan>
      <tspan x="0" dy="36">to restorative touch that leaves skin fresh and</tspan>
      <tspan x="0" dy="36">renewed. Designed for maintenance between</tspan>
      <tspan x="0" dy="36">regular facial treatments, The Essentials</tspan>
      <tspan x="0" dy="36">delivers exactly what your skin needs.</tspan>
      <tspan x="0" dy="36">*Option to add on a plant-based AHA peel.</tspan>
    </text>
  </g>
</svg>

