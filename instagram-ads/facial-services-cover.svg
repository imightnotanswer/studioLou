<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      <![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Figtree:wght@300;400;600&display=swap');
      .title { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; }
      ]]>
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="1080" height="1080" fill="#f4ecd3"/>
  
  <!-- Container with rounded corners and burnt orange border -->
  <g>
    <!-- Container background -->
    <rect x="30" y="30" width="1020" height="1020" rx="16" ry="16" fill="#f4ecd3"/>
    
    <!-- Decorative spirals - soft blue (organic placement) -->
    <g opacity="0.25" stroke="#9ab4c1" fill="none" stroke-width="2.5" stroke-linecap="round">
      <!-- Top left spiral -->
      <g transform="translate(150, 180)">
        <path d="M 50 50 m 0 -35 a 35 35 0 0 1 0 70 a 28 28 0 0 1 0 -56 a 21 21 0 0 1 0 42 a 14 14 0 0 1 0 -28 a 7 7 0 0 1 0 14" />
      </g>
      
      <!-- Top right spiral -->
      <g transform="translate(990, 150)">
        <path d="M 50 50 m 0 -35 a 35 35 0 0 1 0 70 a 28 28 0 0 1 0 -56 a 21 21 0 0 1 0 42 a 14 14 0 0 1 0 -28" />
      </g>
      
      <!-- Bottom left spiral -->
      <g transform="translate(130, 930)">
        <path d="M 50 50 m 0 -35 a 35 35 0 0 1 0 70 a 28 28 0 0 1 0 -56 a 21 21 0 0 1 0 42" />
      </g>
      
      <!-- Middle right accent -->
      <g transform="translate(940, 530) scale(0.6)">
        <path d="M 50 50 m 0 -35 a 35 35 0 0 1 0 70 a 28 28 0 0 1 0 -56 a 21 21 0 0 1 0 42" />
      </g>
    </g>
    
    <!-- Main Content -->
    <g transform="translate(540, 540)">
      <!-- Title -->
      <text x="0" y="0" text-anchor="middle" class="title" font-size="110" fill="#440a09" font-weight="800" letter-spacing="-1">
        Facial Services
      </text>
      
      <!-- Right arrow indicating swipe -->
      <g transform="translate(0, 80)">
        <!-- Arrow line -->
        <line x1="-60" y1="0" x2="60" y2="0" stroke="#b72b0f" stroke-width="2" stroke-linecap="round"/>
        <!-- Arrowhead -->
        <path d="M 50 -8 L 60 0 L 50 8" stroke="#b72b0f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </g>
</svg>

